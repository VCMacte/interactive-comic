<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240">
<style>
  .idle { animation: idle 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes idle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @media (prefers-reduced-motion: reduce) { .idle { animation: none } }
  
</style>
<g class="idle">

<rect x="0" y="0" width="220" height="160" fill="#e9e6de"/>
<rect x="20" y="0" width="60" height="60" fill="#f7f5f0"/>
<rect x="120" y="20" width="60" height="60" fill="#f7f5f0"/>
<rect x="60" y="100" width="80" height="60" fill="#cdc9bf"/>

<!-- голова -->
<rect x="220" y="40" width="80" height="100" fill="#d9c9b4"/>
<rect x="220" y="20" width="80" height="40" fill="#e9e6de"/>
<rect x="240" y="80" width="18" height="18" fill="#1d1d1d"/>
<rect x="272" y="80" width="18" height="18" fill="#1d1d1d"/>
<rect x="220" y="40" width="16" height="32" fill="#c4b3a0"/>

<!-- ноги -->
<rect x="20" y="160" width="44" height="80" fill="#d9c9b4"/>
<rect x="100" y="160" width="44" height="80" fill="#d9c9b4"/>
<rect x="170" y="160" width="44" height="80" fill="#d9c9b4"/>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 240" width="260" height="240">
<style>
  .idle { animation: idle 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes idle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @media (prefers-reduced-motion: reduce) { .idle { animation: none } }
  
</style>
<g class="idle">

<rect x="0" y="60" width="160" height="120" fill="#a8aab0"/>
<rect x="20" y="80" width="60" height="60" fill="#6f737a"/>

<!-- голова -->
<rect x="140" y="20" width="100" height="100" fill="#a8aab0"/>
<rect x="200" y="60" width="60" height="48" fill="#d6d8dc"/>
<rect x="240" y="72" width="20" height="20" fill="#2b2b2b"/>
<rect x="172" y="52" width="18" height="18" fill="#2b2b2b"/>
<rect x="212" y="52" width="18" height="18" fill="#2b2b2b"/>
<rect x="140" y="0" width="28" height="28" fill="#6f737a"/>
<rect x="200" y="0" width="28" height="28" fill="#6f737a"/>

<!-- хвост и лапы -->
<rect x="0" y="28" width="32" height="48" fill="#6f737a"/>
<rect x="28" y="180" width="40" height="48" fill="#a8aab0"/>
<rect x="108" y="180" width="40" height="48" fill="#d6d8dc"/>
<rect x="172" y="120" width="40" height="108" fill="#a8aab0"/>
</g>
</svg>

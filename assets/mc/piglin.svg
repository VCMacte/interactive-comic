<rect x="228" y="340" width="48" height="40" fill="#d59a86"/>
<rect x="220" y="364" width="64" height="40" fill="#e8c04a"/>
<rect x="220" y="364" width="64" height="12" fill="#bf9526"/>

<!-- ноги -->
<rect x="92" y="416" width="60" height="184" fill="#b57a68"/>
<rect x="168" y="416" width="60" height="184" fill="#b57a68"/>
<rect x="92" y="600" width="60" height="40" fill="#3a2a24"/>

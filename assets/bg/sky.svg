<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a1430"/>
    <stop offset="0.62" stop-color="#1b2d4d"/>
    <stop offset="1" stop-color="#24395c"/>
  </linearGradient>
  <radialGradient id="moonGlow">
    <stop offset="0" stop-color="#fdf6d8" stop-opacity="0.55"/>
    <stop offset="0.45" stop-color="#fdf6d8" stop-opacity="0.13"/>
    <stop offset="1" stop-color="#fdf6d8" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
  .halo { animation: breathe 9s ease-in-out infinite; transform-origin: 1480px 230px; }
  @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
  @media (prefers-reduced-motion: reduce) { .halo { animation: none } }
</style>
<rect width="1920" height="1080" fill="url(#sky)"/>
<circle class="halo" cx="1480" cy="230" r="330" fill="url(#moonGlow)"/>
<circle cx="1480" cy="230" r="96" fill="#fdf6d8"/>
<circle cx="1512" cy="206" r="14" fill="#efe6c2" opacity="0.5"/>
<circle cx="1452" cy="262" r="20" fill="#efe6c2" opacity="0.4"/>
<circle cx="1498" cy="272" r="9" fill="#efe6c2" opacity="0.45"/>
</svg>

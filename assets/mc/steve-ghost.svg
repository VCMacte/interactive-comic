<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640">
<style>
  .idle { animation: idle 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes idle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @media (prefers-reduced-motion: reduce) { .idle { animation: none } }
  .idle { animation: none; opacity: 0.62 }
</style>
<g class="idle">

<!-- голова -->
<rect x="80" y="0" width="160" height="160" fill="#9b93b0"/>
<rect x="80" y="0" width="160" height="40" fill="#53496b"/>
<rect x="80" y="40" width="20" height="20" fill="#53496b"/>
<rect x="220" y="40" width="20" height="20" fill="#53496b"/>
<rect x="110" y="60" width="30" height="20" fill="#e8e4f2"/>
<rect x="170" y="60" width="30" height="20" fill="#e8e4f2"/>
<rect x="120" y="60" width="20" height="20" fill="#53496b"/>
<rect x="180" y="60" width="20" height="20" fill="#53496b"/>
<rect x="130" y="110" width="60" height="16" fill="#7d7593"/>

<!-- туловище и руки -->
<rect x="80" y="160" width="160" height="240" fill="#7f9fb8"/>
<rect x="0" y="160" width="80" height="180" fill="#7f9fb8"/>
<rect x="240" y="160" width="80" height="180" fill="#7f9fb8"/>
<rect x="0" y="340" width="80" height="60" fill="#9b93b0"/>
<rect x="240" y="340" width="80" height="60" fill="#9b93b0"/>

<!-- ноги -->
<rect x="80" y="400" width="80" height="200" fill="#6a6a9c"/>
<rect x="160" y="400" width="80" height="200" fill="#6a6a9c"/>
<rect x="80" y="600" width="80" height="40" fill="#5e5a74"/>
<rect x="160" y="600" width="80" height="40" fill="#5e5a74"/>
</g>
</svg>

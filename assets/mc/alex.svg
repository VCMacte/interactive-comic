<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 640" width="340" height="640">
<style>
  .idle { animation: idle 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes idle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @media (prefers-reduced-motion: reduce) { .idle { animation: none } }
  
</style>
<g class="idle">

<!-- голова -->
<rect x="80" y="0" width="160" height="160" fill="#d8a27c"/>
<rect x="80" y="0" width="160" height="40" fill="#b85c1e"/>
<rect x="80" y="40" width="20" height="40" fill="#b85c1e"/>
<rect x="220" y="40" width="20" height="40" fill="#b85c1e"/>
<rect x="108" y="60" width="32" height="24" fill="#ffffff"/>
<rect x="176" y="60" width="32" height="24" fill="#ffffff"/>
<rect x="120" y="64" width="18" height="18" fill="#3a6b4a"/>
<rect x="188" y="64" width="18" height="18" fill="#3a6b4a"/>
<rect x="128" y="112" width="64" height="14" fill="#a66a48"/>

<!-- коса набок: выходит за голову, чтобы её было видно силуэтом -->
<rect x="240" y="28" width="52" height="40" fill="#b85c1e"/>
<rect x="268" y="68" width="40" height="100" fill="#b85c1e"/>
<rect x="268" y="100" width="40" height="12" fill="#8e4414"/>
<rect x="268" y="140" width="40" height="12" fill="#8e4414"/>
<rect x="276" y="168" width="24" height="20" fill="#8e4414"/>

<!-- туловище и руки -->
<rect x="80" y="160" width="160" height="240" fill="#4e9a52"/>
<rect x="80" y="160" width="160" height="20" fill="#3c7a40"/>
<rect x="0" y="160" width="80" height="180" fill="#4e9a52"/>
<rect x="240" y="160" width="80" height="180" fill="#4e9a52"/>
<rect x="0" y="340" width="80" height="60" fill="#d8a27c"/>
<rect x="240" y="340" width="80" height="60" fill="#d8a27c"/>

<!-- меч в правой руке, остриём вперёд-вверх -->
<g transform="translate(284 372) rotate(-28)">
<rect x="-9" y="-184" width="18" height="148" fill="#c8ccd2"/>
<rect x="-9" y="-184" width="7" height="148" fill="#eef1f5"/>
<rect x="-4" y="-202" width="8" height="18" fill="#c8ccd2"/>
<rect x="-22" y="-36" width="44" height="14" fill="#8f949c"/>
<rect x="-8" y="-22" width="16" height="48" fill="#5a3e20"/>
<rect x="-12" y="26" width="24" height="12" fill="#8f949c"/></g>

<!-- ноги -->
<rect x="80" y="400" width="80" height="200" fill="#6b5a3a"/>
<rect x="160" y="400" width="80" height="200" fill="#6b5a3a"/>
<rect x="80" y="600" width="80" height="40" fill="#4a3a28"/>
<rect x="160" y="600" width="80" height="40" fill="#4a3a28"/>
</g>
</svg>

<!doctype html>
<meta charset="utf-8">
<title>Растеризация слоёв</title>
<style>body{font:14px/1.6 system-ui;background:#111;color:#eee;padding:2rem}pre{white-space:pre-wrap}</style>
<h1>Растеризация слоёв</h1>
<pre id="log">готов</pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script type="module">
// На машине нет ни ImageMagick, ни Inkscape, ни cairosvg, а SVG нужно
// превращать в растр дважды: до генерации (init-картинка для img2img)
// и после неё (возврат прозрачности и сборка в рабочий размер).
// Браузер — единственный доступный растеризатор, поэтому вся работа здесь.

const log = (m) => { document.getElementById('log').textContent += '\n' + m; };

const load = (src) => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => resolve(img);
  img.onerror = () => reject(new Error('не загрузилось: ' + src));
  img.src = src;
});

async function save(path, canvas, type = 'image/png', quality) {
  const res = await fetch('/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path, dataUrl: canvas.toDataURL(type, quality) }),
  });
  const out = await res.json();
  if (out.error) throw new Error(out.error);
  return out.bytes;
}

function canvasOf(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/**
 * Пасс 1 — init-картинки для img2img.
 * Прозрачные слои кладём на тёмный фон: генератору нужен непрозрачный вход,
 * а чёрная подложка ближе всего к нашей ночной палитре и меньше всего
 * сбивает его с композиции.
 */
window.rasterInit = async (jobs, w, h) => {
  const done = [];
  for (const job of jobs) {
    const img = await load(job.src);
    const c = canvasOf(w, h);
    const ctx = c.getContext('2d');
    ctx.fillStyle = job.bg || '#0a1430';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    done.push(`${job.out}  ${await save(job.out, c)} байт`);
    log('init: ' + job.out);
  }
  return done;
};

/**
 * Пасс 2 — сборка результата.
 * Генератор возвращает непрозрачный прямоугольник, а слою нужна исходная
 * прозрачность, иначе дальний план закроет небо. Поэтому поверх рисунка
 * применяем маску из того же SVG: destination-in оставляет только то,
 * что попадает в силуэт.
 */
window.composeLayer = async ({ painted, mask, out, w, h, keepAlpha, softMask, chromaKey, type, quality }) => {
  const img = await load(painted);
  const c = canvasOf(w, h);
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);

  if (keepAlpha) {
    const m = await load(mask);
    ctx.globalCompositeOperation = 'destination-in';
    ctx.drawImage(m, 0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over';
  }

  // Хромакей. У дальнего плана после покраски небо залито ровной синевой
  // от init-подложки. Жёсткая маска по исходному силуэту тут не годится:
  // нейросеть делает кубы объёмными, и они вылезают за исходный контур —
  // маска срезала бы им края. Поэтому убираем именно цвет подложки.
  if (chromaKey) {
    const [kr, kg, kb] = chromaKey.rgb;
    const tol = chromaKey.tolerance ?? 70;
    const data = ctx.getImageData(0, 0, w, h);
    const d = data.data;
    for (let i = 0; i < d.length; i += 4) {
      const dist = Math.hypot(d[i] - kr, d[i + 1] - kg, d[i + 2] - kb);
      if (dist < tol) d[i + 3] = 0;
      else if (dist < tol * 1.6) d[i + 3] = Math.round(255 * ((dist - tol) / (tol * 0.6)));
    }
    ctx.putImageData(data, 0, 0);
  }

  // Мягкая маска для дальнего плана. Жёсткий силуэт срезает написанную
  // дымку над лесом, и слой становится плоским набором тонких фигур.
  // Градиент оставляет атмосферу и при этом не закрывает небо.
  if (softMask) {
    const g = ctx.createLinearGradient(0, h * softMask[0], 0, h * softMask[1]);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.globalCompositeOperation = 'destination-in';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over';
  }

  // WebP вместо PNG: фотографические градиенты в PNG весят в разы больше,
  // а комплект слоёв целиком уходит в офлайн-кэш приложения.
  const bytes = await save(out, c, type || 'image/png', quality);
  log('готово: ' + out + ' — ' + bytes + ' байт');
  return bytes;
};

/**
 * Перегон озвучки из WAV в MP3. Нейросетевой синтез отдаёт только WAV,
 * а это сорок восемь килобайт на секунду речи — весь комплект не влез бы
 * ни в репозиторий, ни в офлайн-кэш приложения.
 */
window.transcodeAudio = async (ids, bitrate = 40) => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const done = [];
  let total = 0;

  for (const id of ids) {
    const buf = await fetch('/tools/tts/wav/' + id + '.wav').then(r => r.arrayBuffer());
    const audio = await ctx.decodeAudioData(buf);

    const pcm = audio.getChannelData(0);
    const samples = new Int16Array(pcm.length);
    for (let i = 0; i < pcm.length; i++) {
      const v = Math.max(-1, Math.min(1, pcm[i]));
      samples[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }

    const enc = new lamejs.Mp3Encoder(1, audio.sampleRate, bitrate);
    const chunks = [];
    const BLOCK = 1152;
    for (let i = 0; i < samples.length; i += BLOCK) {
      const part = enc.encodeBuffer(samples.subarray(i, i + BLOCK));
      if (part.length) chunks.push(new Int8Array(part));
    }
    const tail = enc.flush();
    if (tail.length) chunks.push(new Int8Array(tail));

    const blob = new Blob(chunks, { type: 'audio/mpeg' });
    const dataUrl = await new Promise((resolve) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.readAsDataURL(blob);
    });

    const res = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: 'assets/audio/' + id + '.mp3', dataUrl }),
    });
    const out = await res.json();
    if (out.error) throw new Error(id + ': ' + out.error);

    total += out.bytes;
    done.push(id);
    if (done.length % 20 === 0) log('сжато ' + done.length + ' из ' + ids.length);
  }

  log('готово: ' + done.length + ' файлов, ' + Math.round(total / 1024) + ' КБ');
  return { count: done.length, kb: Math.round(total / 1024) };
};

/**
 * Обложка для главного экрана — те же слои сцены, сложенные в один кадр.
 * Отдельных картинок рисовать не нужно: обложка обязана совпадать с тем,
 * что ребёнок увидит, нажав на карточку.
 */
window.composeCover = async ({ layers, cast = [], out, w = 640, h = 360 }) => {
  const c = canvasOf(w, h);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0b0d14';
  ctx.fillRect(0, 0, w, h);

  for (const src of layers) {
    if (!src) continue;
    ctx.drawImage(await load(src), -w * 0.04, -h * 0.04, w * 1.08, h * 1.08);
  }

  for (const actor of cast) {
    const img = await load(actor.src);
    const cw = w * (actor.w / 100);
    const ch = cw * (img.naturalHeight / img.naturalWidth);
    ctx.drawImage(img, w * (actor.x / 100), h - h * (actor.y / 100) - ch, cw, ch);
  }

  const bytes = await save(out, c, 'image/webp', 0.85);
  log('обложка: ' + out + ' — ' + bytes + ' байт');
  return bytes;
};
</script>

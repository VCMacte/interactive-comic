<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
<style>
  .idle { animation: idle 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes idle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @media (prefers-reduced-motion: reduce) { .idle { animation: none } }
  
</style>
<g class="idle">

<!-- верхняя и нижняя обвязка -->
<rect x="6" y="0" width="188" height="20" fill="#9a9aa2"/>
<rect x="6" y="0" width="188" height="6" fill="#c2c2ca"/>
<rect x="6" y="198" width="188" height="22" fill="#9a9aa2"/>
<rect x="6" y="212" width="188" height="8" fill="#6e6e76"/>

<!-- стойки по углам толще прутьев -->
<rect x="6" y="18" width="18" height="184" fill="#9a9aa2"/>
<rect x="176" y="18" width="18" height="184" fill="#9a9aa2"/>
<rect x="176" y="18" width="6" height="184" fill="#6e6e76"/>

<!-- прутья -->
<rect x="16" y="18" width="10" height="184" fill="#9a9aa2"/>
<rect x="58.00000000000001" y="18" width="10" height="184" fill="#9a9aa2"/>
<rect x="100" y="18" width="10" height="184" fill="#9a9aa2"/>
<rect x="142" y="18" width="10" height="184" fill="#9a9aa2"/>
<rect x="184.00000000000003" y="18" width="10" height="184" fill="#9a9aa2"/>

<!-- поперечина и замок: по тексту он поддаётся с третьего раза -->
<rect x="6" y="100" width="188" height="10" fill="#6e6e76"/>
<rect x="82" y="108" width="36" height="32" fill="#d9a93a"/>
<rect x="82" y="130" width="36" height="10" fill="#a87c1c"/>
<rect x="94" y="118" width="12" height="14" fill="#a87c1c"/>
</g>
</svg>

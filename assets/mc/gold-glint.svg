<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 104" width="220" height="104">
<style>
  .idle { animation: idle 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes idle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @media (prefers-reduced-motion: reduce) { .idle { animation: none } }
  .idle { animation: none }
</style>
<g class="idle">

<!-- самородок покрупнее и блик на нём -->
<rect x="44" y="48" width="68" height="52" fill="#e8c04a"/>
<rect x="44" y="88" width="68" height="12" fill="#b8912c"/>
<rect x="56" y="56" width="28" height="20" fill="#fff0b0"/>

<!-- вторая крупинка рядом: одна читается случайной, две — следом -->
<rect x="124" y="72" width="36" height="28" fill="#e8c04a"/>
<rect x="124" y="92" width="36" height="8" fill="#b8912c"/>

<!-- копытца: по две половинки, как у настоящего следа -->
<rect x="4" y="12" width="22" height="28" fill="#5e4a35"/>
<rect x="30" y="18" width="22" height="28" fill="#5e4a35"/>
<rect x="84" y="4" width="22" height="28" fill="#5e4a35"/>
<rect x="110" y="10" width="22" height="28" fill="#5e4a35"/>
<rect x="160" y="16" width="22" height="28" fill="#5e4a35"/>
<rect x="186" y="22" width="22" height="28" fill="#5e4a35"/>
</g>
</svg>

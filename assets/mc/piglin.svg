<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640">
<style>
  .idle { animation: idle 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes idle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @media (prefers-reduced-motion: reduce) { .idle { animation: none } }
  
</style>
<g class="idle">

<!-- голова -->
<rect x="80" y="0" width="160" height="152" fill="#d59a86"/>
<rect x="52" y="24" width="28" height="52" fill="#b57a68"/>
<rect x="240" y="24" width="28" height="52" fill="#b57a68"/>
<rect x="108" y="60" width="28" height="20" fill="#2b1a16"/>
<rect x="184" y="60" width="28" height="20" fill="#2b1a16"/>

<!-- пятачок -->
<rect x="116" y="92" width="88" height="52" fill="#eab5a2"/>
<rect x="136" y="108" width="18" height="20" fill="#b57a68"/>
<rect x="168" y="108" width="18" height="20" fill="#b57a68"/>

<!-- золотые бусы -->
<rect x="76" y="152" width="168" height="24" fill="#e8c04a"/>
<rect x="100" y="176" width="24" height="20" fill="#bf9526"/>
<rect x="148" y="176" width="24" height="20" fill="#bf9526"/>
<rect x="196" y="176" width="24" height="20" fill="#bf9526"/>

<!-- туника -->
<rect x="72" y="176" width="176" height="240" fill="#5c4a6a"/>
<rect x="152" y="196" width="16" height="220" fill="#453657"/>

<!-- руки: в одной слиток, который он никому не отдаёт -->
<rect x="44" y="212" width="48" height="128" fill="#5c4a6a"/>
<rect x="228" y="212" width="48" height="128" fill="#5c4a6a"/>

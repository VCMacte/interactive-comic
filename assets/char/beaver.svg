<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 170 326 206" width="326" height="206">
<style>
  .idle { animation: idle 3.4s ease-in-out infinite; transform-origin: 200px 340px; }
  @keyframes idle { 0%,100% { transform: translateY(0) scaleY(1) } 50% { transform: translateY(-5px) scaleY(1.015) } }
  .blink { animation: blink 5.2s ease-in-out infinite; transform-origin: center; }
  @keyframes blink { 0%,94%,100% { transform: scaleY(1) } 97% { transform: scaleY(0.08) } }
  @media (prefers-reduced-motion: reduce) { .idle, .blink { animation: none } }
  
</style>
<g class="idle">

<!-- хвост-лопата -->
<ellipse cx="96" cy="320" rx="68" ry="34" fill="#432a1a" transform="rotate(-14 96 320)"/>
<ellipse cx="96" cy="320" rx="68" ry="34" fill="none" stroke="#9cc0f0" stroke-width="2.5" opacity="0.2" transform="rotate(-14 96 320)"/>

<ellipse cx="208" cy="276" rx="104" ry="94" fill="#6e4529"/>
<ellipse cx="208" cy="276" rx="104" ry="94" fill="none" stroke="#9cc0f0" stroke-width="3" opacity="0.22"/>
<circle cx="274" cy="200" r="20" fill="#432a1a"/>

<ellipse cx="282" cy="258" rx="54" ry="46" fill="#d9b795"/>
<ellipse cx="316" cy="246" rx="13" ry="10" fill="#15111f"/>

<g class="blink" style="transform-origin:276px 222px">
  <ellipse cx="276" cy="222" rx="13" ry="14" fill="#f7f1e3"/>
  <circle cx="280" cy="223" r="7.5" fill="#15111f"/>
  <circle cx="283" cy="219" r="2.8" fill="#f7f1e3"/>
</g>

<!-- передние зубы -->
<rect x="296" y="276" width="13" height="26" rx="4" fill="#fffaf0"/>
<rect x="312" y="276" width="13" height="26" rx="4" fill="#fffaf0"/>

<ellipse cx="176" cy="356" rx="30" ry="16" fill="#432a1a"/>
<ellipse cx="252" cy="356" rx="30" ry="16" fill="#432a1a"/>
</g>
</svg>
